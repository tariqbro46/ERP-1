<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TallyFlow ERP</title>
    <meta name="description" content="A professional, keyboard-centric Universal ERP inspired by TallyPrime with double-entry bookkeeping, inventory management, and real-time financial reporting." />
    <meta property="og:title" content="TallyFlow ERP" />
    <meta property="og:description" content="A professional, keyboard-centric Universal ERP inspired by TallyPrime with double-entry bookkeeping, inventory management, and real-time financial reporting." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/pixel-art/svg?seed=erp-icon&size=192" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('theme') || 'classic';
          var validThemes = ['light', 'dark', 'emerald', 'amber', 'rose', 'slate', 'classic'];
          if (validThemes.indexOf(theme) === -1) theme = 'classic';
          root.classList.add(theme);

          var lang = localStorage.getItem('app_language') || 'en';
          var sysRaw = localStorage.getItem('swr_system_config');
          var sysCfg = sysRaw ? JSON.parse(sysRaw) : {};

          var profRaw = localStorage.getItem('cached_auth_profile');
          var prof = profRaw ? JSON.parse(profRaw) : {};
          var compCfg = {};
          if (prof && prof.companyId) {
            var compRaw = localStorage.getItem('swr_settings_' + prof.companyId);
            if (compRaw) compCfg = JSON.parse(compRaw);
          }
          var userCfg = {};
          if (prof && prof.uid) {
            var uRaw = localStorage.getItem('swr_usersettings_' + prof.uid);
            if (uRaw) userCfg = JSON.parse(uRaw);
          }

          var uiStyle = sysCfg.uiStyle || userCfg.uiStyle || compCfg.uiStyle || 'UI/UX 1';
          var glassBg = sysCfg.glassBackground || userCfg.glassBackground || compCfg.glassBackground || 'default';
          root.setAttribute('data-ui-style', uiStyle);
          root.setAttribute('data-glass-bg', glassBg);

          var font = lang === 'bn'
            ? (userCfg.banglaFont || compCfg.banglaFont || sysCfg.banglaFont || 'Hind Siliguri')
            : (userCfg.englishFont || compCfg.englishFont || sysCfg.englishFont || 'Inter');
          root.style.setProperty('--app-font', '"' + font + '", sans-serif');

          var bgMap = {
            dark: '#0a0a0a',
            classic: '#f1f5f9',
            light: '#ffffff',
            slate: '#f8fafc',
            emerald: '#f0fdf4',
            amber: '#fffbeb',
            rose: '#fff1f2'
          };
          var fgMap = {
            dark: '#f8fafc',
            classic: '#1e293b',
            light: '#0a0a0a',
            slate: '#0f172a',
            emerald: '#064e3b',
            amber: '#78350f',
            rose: '#881337'
          };
          var isUi4 = uiStyle === 'UI/UX 4';
          root.style.backgroundColor = isUi4 ? '#070b14' : (bgMap[theme] || '#f1f5f9');
          root.style.color = isUi4 ? '#f1f5f9' : (fgMap[theme] || '#1e293b');
          if (isUi4 || theme === 'dark') {
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        const isDevOrPreview = window.location.hostname === 'localhost' || window.location.hostname.includes('run.app');
        if (isDevOrPreview) {
          // In development/preview container, unregister all workers and purge all caches
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name);
              }
            });
          }
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            let hadRegistration = false;
            for (const registration of registrations) {
              registration.unregister();
              hadRegistration = true;
            }
            if (hadRegistration && navigator.serviceWorker.controller) {
              if (!sessionStorage.getItem('sw_purged_dev_v4')) {
                sessionStorage.setItem('sw_purged_dev_v4', '1');
                window.location.reload();
              }
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                registration.onupdatefound = () => {
                  const installingWorker = registration.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = () => {
                      if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.location.reload();
                      }
                    };
                  }
                };
              })
              .catch((error) => {
                console.error('Service Worker registration failed:', error);
              });
          });

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          });
        }
      }

      // Global error handler to catch chunk load errors and force refresh
      window.addEventListener('error', (event) => {
        if (event.message && (event.message.includes('ChunkLoadError') || event.message.includes('Loading chunk'))) {
          console.warn('Chunk load error detected, forcing reload...');
          window.location.reload();
        }
      }, true);
    </script>
  </body>
</html>
